[tools]
node = "24"
python = "3.12"
gitleaks = "latest"
uv = "latest"

[tools."npm:markdownlint-cli2"]
version = "0.18"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:manifests"]

[tasks."lint:md"]
description = "Lint markdown files"
run = "npx markdownlint-cli2 '**/*.md' '#node_modules'"

[tasks."lint:manifests"]
description = "Validate all manifests and skill frontmatter"
run = "python3 tools/validate.py"

[tasks."lint:skill-parity"]
description = "Check plugin skills are in sync with canonical sources"
run = "python3 tools/sync-plugin-skills.py --check"

[tasks."lint:spec"]
description = "Validate Agent Plugins v1.0.0 conformance (plugins/)"
run = "uv run --with jsonschema --with pyyaml python tools/validate_spec.py"

[tasks."lint:artifacts"]
description = "Validate aws-startup-advisor fixture artifacts against their published schema contracts"
run = "python3 plugins/aws-startup-advisor/scripts/validate-artifacts.py --fixtures"

[tasks."lint:vendored-parity"]
description = "Check each skill's references/vendored/ copies are byte-identical to skills/shared/"
run = "python3 tools/sync-vendored.py --check"

[tasks."lint:skill-refs"]
description = "Check every file path the aws-startup-advisor skills reference exists"
run = "python3 tools/check-skill-refs.py --check"

[tasks.validate]
description = "Run all validation"
depends = ["lint:manifests", "lint:skill-parity", "lint:spec", "lint:artifacts", "lint:vendored-parity", "lint:skill-refs"]

[tasks.security]
description = "Run security scans"
run = "gitleaks detect --source . --verbose"

[tasks.build]
description = "Full build: lint + validate + security"
depends = ["lint", "validate", "security"]
