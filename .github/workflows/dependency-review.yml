name: Dependency Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no permissions; grant minimally at the job level.
permissions:
  actions: none
  attestations: none
  checks: none
  contents: none
  deployments: none
  discussions: none
  id-token: none
  issues: none
  models: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Shared Amazon OSPO dependency-review config used across awslabs/aws repos.
          config-file: amazon-ospo/dependency-review-config/default/dependency-review-config.yml@8e4c9fdde54d2b7c6a3a28b97eddd26c4cd90a66 # main
          # Licence-only exemption, merged on top of the shared config above
          # (the action applies inline inputs per key, so `allow-licenses` is
          # left untouched). Vulnerability checks still apply to this package.
          #
          # typing-extensions is PSF-licensed (Python-2.0), but its published
          # metadata aggregates to "Python-2.0 AND GPL-1.0-or-later AND
          # Python-2.0 AND BSD-3-Clause AND ... AND 0BSD" — the stray
          # GPL-1.0-or-later term comes from the historical Python licence
          # text bundled in its LICENSE file, not from an actual GPL grant.
          # Because the shared config is an allowlist and every term in a
          # composite expression must match, that one term fails the package.
          # It reaches us only transitively (jsonschema -> referencing,
          # openai -> pydantic/anyio, exceptiongroup).
          allow-dependencies-licenses: "pkg:pypi/typing-extensions"
