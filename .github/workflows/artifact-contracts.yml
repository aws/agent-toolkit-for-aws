# Freshness/consistency gate for aws-startup-advisor's fixture artifact contracts.
#
# Runs on pull requests that touch plugins/aws-startup-advisor/, not on every
# PR. A failing check is the notification: it shows on the pull request.
# Checks only the shipped fixture corpus against its published schema
# contracts (see plugins/aws-startup-advisor/scripts/validate-artifacts.py);
# does not touch anything outside the plugin.
name: Artifact contracts
on:
  pull_request:
    paths:
      - "plugins/aws-startup-advisor/**"
      - ".github/workflows/artifact-contracts.yml"
  workflow_dispatch: {}
permissions:
  actions: none
  contents: none
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate fixture artifacts against their schema contracts
        run: python3 plugins/aws-startup-advisor/scripts/validate-artifacts.py --fixtures
