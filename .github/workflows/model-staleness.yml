# Scheduled freshness gate for the Bedrock model-lifecycle registry.
#
# The design/estimate phases pick Bedrock models against a vendored
# `ai-model-lifecycle.md` registry (Active/Legacy/EOL table + the 90-day
# exclusion rule). That registry declares its own freshness contract
# (**Last updated** + **Staleness window**), but nothing enforced it — a
# snapshot that quietly crosses its window silently degrades every model
# recommendation (a model can go Active -> Legacy -> gone in a 45-day Legacy
# period). `mise run lint:model-staleness` reports staleness warn-only (a stale
# registry must not fail unrelated PRs); this weekly job runs the same tool with
# --strict so staleness becomes a visible failure someone owns, prompting a
# data-refresh PR. Strict mode also fails on a drifted vendored copy.
name: Model lifecycle staleness
on:
  schedule:
    - cron: "23 14 * * 1" # weekly, Monday
  workflow_dispatch: {}
permissions:
  actions: none
  contents: none
jobs:
  staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Check Bedrock model-lifecycle registry freshness (strict)
        run: python3 tools/model-staleness.py --strict
